<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteos Atlacomulco</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --ticket-free: #334155;
      --ticket-sold: #ef4444;
      --ticket-selected: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      max-width: 600px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    .prize-card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 15px 20px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
    }

    .prize-card h2 {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .color-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
    }

    .box-free { background-color: var(--ticket-free); }
    .box-sold { background-color: var(--ticket-sold); }
    .box-selected { background-color: var(--ticket-selected); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 30px;
    }

    .ticket {
      aspect-ratio: 1;
      background-color: var(--ticket-free);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.2s;
    }

    .ticket:hover:not(.sold) {
      transform: scale(1.05);
    }

    .ticket.selected {
      background-color: var(--ticket-selected);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    .ticket.sold {
      background-color: var(--ticket-sold);
      cursor: not-allowed;
      opacity: 0.6;
      text-decoration: line-through;
    }

    .form-container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
        gap: 6px;
      }
      .ticket {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎟️ Sorteos Atlacomulco</h1>
    <p class="subtitle">¡Selecciona tus números de la suerte y apártalos por WhatsApp!</p>
    <div class="prize-card">
      <h2>Premio: $1,200 MXN en Efectivo 💵</h2>
      <p style="margin-top:5px; font-size: 0.9rem; color: #cbd5e1;">Costo por boleto: <strong>$20 MXN</strong></p>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><div class="color-box box-free"></div> Disponible</div>
    <div class="legend-item"><div class="color-box box-selected"></div> Seleccionado</div>
    <div class="legend-item"><div class="color-box box-sold"></div> Vendido</div>
  </div>

  <div class="grid-container" id="ticketsContainer">
    <!-- Se generan los 100 boletos -->
  </div>

  <div class="form-container">
    <form id="raffleForm">
      <div class="form-group">
        <label for="userName">Nombre Completo:</label>
        <input type="text" id="userName" placeholder="Ej. Juan Pérez" required>
      </div>
      <div class="form-group">
        <label>Boletos seleccionados:</label>
        <input type="text" id="selectedTicketsInput" value="Ninguno" readonly style="color: var(--accent); font-weight: bold;">
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit" disabled>
        Apartar por WhatsApp 💬
      </button>
    </form>
  </div>

  <script>
    const TOTAL_TICKETS = 100;
    
    // Escribe aquí tus 10 dígitos de teléfono entre las comillas:
    const MY_PHONE_NUMBER = "TUS_10_DIGITOS"; 

    // Números vendidos (ejemplo: const soldTickets = [3, 14, 25];)
    const soldTickets = [];

    const selectedTickets = new Set();
    const container = document.getElementById('ticketsContainer');
    const selectedInput = document.getElementById('selectedTicketsInput');
    const btnSubmit = document.getElementById('btnSubmit');

    for (let i = 1; i <= TOTAL_TICKETS; i++) {
      const ticket = document.createElement('div');
      ticket.classList.add('ticket');
      ticket.textContent = i;

      if (soldTickets.includes(i)) {
        ticket.classList.add('sold');
      } else {
        ticket.addEventListener('click', () => toggleTicket(i, ticket));
      }

      container.appendChild(ticket);
    }

    function toggleTicket(number, element) {
      if (selectedTickets.has(number)) {
        selectedTickets.delete(number);
        element.classList.remove('selected');
      } else {
        selectedTickets.add(number);
        element.classList.add('selected');
      }
      updateForm();
    }

    function updateForm() {
      const sorted = Array.from(selectedTickets).sort((a, b) => a - b);
      if (sorted.length > 0) {
        selectedInput.value = sorted.join(', ');
        btnSubmit.disabled = false;
      } else {
        selectedInput.value = "Ninguno";
        btnSubmit.disabled = true;
      }
    }

    document.getElementById('raffleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const ticketsStr = Array.from(selectedTickets).sort((a, b) => a - b).join(', ');
      const totalPay = selectedTickets.size * 20;

      const message = `¡Hola! Mi nombre es *${name}*. Me gustaría apartar el/los boleto(s) *#${ticketsStr}* para la Rifa en *Sorteos Atlacomulco* ($1,200 MXN en efectivo).\n\nTotal a pagar: *$${totalPay} MXN*.\n\nQuedo a la espera de los datos de pago.`;

      const fullPhone = "521" + MY_PHONE_NUMBER.replace(/\D/g, '');
      const whatsappUrl = `https://api.whatsapp.com/send?phone=${fullPhone}&text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    });
  </script>
</body>
</html>
