<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Rifa - El Chore</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --selected: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px 10px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .badge-price {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 8px;
      max-height: 450px;
      overflow-y: auto;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .ticket {
      background: #334155;
      color: var(--text);
      padding: 12px 0;
      text-align: center;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .ticket:hover {
      background: #475569;
    }

    .ticket.selected {
      background: var(--selected);
      color: #000;
    }

    .checkout-panel {
      margin-top: 25px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }

    .btn-whatsapp {
      background-color: var(--accent);
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .btn-whatsapp:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎟️ Gran Rifa "El Chore"</h1>
      <p>Premio: $4,000 MXN en Efectivo 💵</p>
      <div class="badge-price">Boleto: $8 MXN</div>
    </header>

    <div class="controls">
      <button onclick="selectRandom()">🎲 Número al Azar</button>
      <button onclick="clearSelection()" style="background-color: #ef4444;">❌ Limpiar Selección</button>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="checkout-panel">
      <h3>Confirmar Apartado</h3>
      <p style="margin-bottom: 15px;">Boletos seleccionados: <strong id="selected-list" style="color: var(--selected);">Ninguno</strong></p>
      
      <div class="form-group">
        <label for="nombre">Tu Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
      </div>

      <button class="btn-whatsapp" onclick="sendWhatsApp()">📲 Apartar por WhatsApp</button>
    </div>
  </div>

  <script>
    const PHONE_NUMBER = "527121947091"; 
    const TOTAL_TICKETS = 800; // Ajustado a 800 boletos
    let selectedTickets = [];

    // Generar la cuadrícula de 800 boletos
    const grid = document.getElementById('grid');
    for (let i = 1; i <= TOTAL_TICKETS; i++) {
      const ticket = document.createElement('div');
      ticket.classList.add('ticket');
      ticket.innerText = i;
      ticket.onclick = () => toggleTicket(i, ticket);
      grid.appendChild(ticket);
    }

    function toggleTicket(number, element) {
      const index = selectedTickets.indexOf(number);
      if (index > -1) {
        selectedTickets.splice(index, 1);
        element.classList.remove('selected');
      } else {
        selectedTickets.push(number);
        element.classList.add('selected');
      }
      updateUI();
    }

    function updateUI() {
      const listText = document.getElementById('selected-list');
      if (selectedTickets.length === 0) {
        listText.innerText = 'Ninguno';
      } else {
        listText.innerText = selectedTickets.sort((a, b) => a - b).join(', ');
      }
    }

    function selectRandom() {
      let randomNum;
      do {
        randomNum = Math.floor(Math.random() * TOTAL_TICKETS) + 1;
      } while (selectedTickets.includes(randomNum));

      const ticketsElements = document.querySelectorAll('.ticket');
      toggleTicket(randomNum, ticketsElements[randomNum - 1]);
    }

    function clearSelection() {
      selectedTickets = [];
      document.querySelectorAll('.ticket').forEach(el => el.classList.remove('selected'));
      updateUI();
    }

    function sendWhatsApp() {
      const nombre = document.getElementById('nombre').value.trim();

      if (selectedTickets.length === 0) {
        alert('Por favor selecciona al menos un número.');
        return;
      }

      if (!nombre) {
        alert('Por favor ingresa tu nombre.');
        return;
      }

      const boletosStr = selectedTickets.sort((a, b) => a - b).join(', ');
      const mensaje = `¡Hola! Mi nombre es *${nombre}*. Me gustaría apartar el/los boleto(s) *#${boletosStr}* para la Rifa *El Chore* ($4,000 en efectivo). Quedo a la espera de los datos de pago.`;

      const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
